syntax = "proto3";

package message;

message GetVarifyReq {
  string email = 1;
}

message GetVarifyRsp {
  int32 error = 1;
  string email = 2;
  string code = 3;
}

service VarifyService {
  rpc GetVarifyCode(GetVarifyReq) returns (GetVarifyRsp);
}

/*
 * Gate Server 向 Status Server 请求分配 Chat Server。
 */
message GetChatServerReq {
    // 仅用于日志和诊断；可信用户身份由 Gate Server 查询 MySQL 得到。
    string email = 1;

    // 旧协议中的 token 字段，不再使用。
    reserved 2;
    reserved "token";

    // MySQL users.uid。
    uint64 uid = 3;

    // 客户端持久化的设备标识。
    uint64 device_id = 4;
}

/*
 * Status Server 返回 Chat Server 地址。
 */
message GetChatServerRsp {
    /*
     * 业务错误码。
     */
    int32 error = 1;

    /*
     * Chat Server IP。
     */
    string ip = 2;

    /*
     * Chat Server 端口。
     */
    int32 port = 3;

    // Status Server 创建并写入 Redis 登录会话的 token。
    string token = 4;

    // 稳定服务器标识，例如 ChatServer1。
    string server_id = 5;
}

service StatusService {
    rpc GetChatServer(GetChatServerReq)
        returns (GetChatServerRsp);
}
