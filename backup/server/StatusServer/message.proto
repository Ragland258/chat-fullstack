syntax = "proto3";

package message;

message GetVarifyReq {
  string email = 1;
}

message GetVarifyRsp {
  int32 error = 1;
  string email = 2;
  string code = 3;
}

service VarifyService {
  rpc GetVarifyCode(GetVarifyReq) returns (GetVarifyRsp);
}

/*
 * Gate Server 向 Status Server 请求分配 Chat Server。
 */
message GetChatServerReq {
    /*
     * 用户登录邮箱。
     *
     * Status Server 根据邮箱构造 Redis Key：
     *
     * login:token:<email>
     */
    string email = 1;

    /*
     * Gate Server 登录成功后创建的 Token。
     *
     * Status Server 不生成 Token，只验证它。
     */
    string token = 2;
}

/*
 * Status Server 返回 Chat Server 地址。
 */
message GetChatServerRsp {
    /*
     * 业务错误码。
     */
    int32 error = 1;

    /*
     * Chat Server IP。
     */
    string ip = 2;

    /*
     * Chat Server 端口。
     */
    int32 port = 3;

    /*
     * Status Server 不再返回 Token。
     */
    reserved 4;
    reserved "token";
}

service StatusService {
    rpc GetChatServer(GetChatServerReq)
        returns (GetChatServerRsp);
}